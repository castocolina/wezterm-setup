# .github/workflows/release.yml
#
# INST-08 supply side: a tag-triggered 3-leg matrix that builds the `wez`
# luastatic binary natively per OS/arch and publishes each as a GitHub Release
# asset under the SAME asset-naming + per-asset .sha256 contract as `make publish`
# (tools/publish.sh) — so a CI-published asset and a maintainer-published asset
# never drift (P6-D08, same-contract rule).
#
# D-01 boundary: this workflow is PURE build+publish glue. It computes NO
# install/version/update decision in YAML — toolchain provisioning is delegated to
# tools/ci-setup-toolchain.sh and the build to tools/build.sh (the SAME path
# `make build` uses locally).
#
# Runner labels (RESEARCH Pitfall 1 / State of the Art): the Intel x86_64 leg uses
# `macos-15-intel` — the older Intel image P6-D01 originally named was REMOVED by
# GitHub on 2025-12-04, so it must never appear here. `macos-14` is the arm64-only
# Apple Silicon image.
#
# NOTE: this workflow is NOT exercised until the first `v*` tag is pushed (a
# maintainer action — RESEARCH Open Q3). Until then it is verified for CORRECTNESS
# (actionlint + greps), not via a live CI run.
name: release

on:
  push:
    tags:
      - "v*"
  # Manual trigger: lets a maintainer dry-run / force a nightly publish from the
  # Actions UI without cutting a version tag. Per D-07 a dispatch ref is a NON-tag
  # ref, so a workflow_dispatch run resolves CHANNEL=nightly and publishes a
  # datestamped nightly-YYYYMMDD prerelease (same path the schedule cron takes).
  workflow_dispatch:
  # D-05: weekly cadence — a self-renewing nightly channel that tracks `main`.
  # The `nightly` keyword is kept by convention (it is the prerelease channel name
  # the installer/`wez update` ask for, D-03), even though the cron fires weekly,
  # not nightly. 06:17 UTC every Monday (off-peak; avoids the top-of-hour rush).
  schedule:
    - cron: "17 6 * * 1"

# Least privilege (T-06-03-03): only the scope `gh release upload` needs.
permissions:
  contents: write

jobs:
  # LINUX-ONLY for v1: the macOS legs are DEFERRED TO PHASE 7 (macOS Parity Pass,
  # D-18), where they get verified on real Intel + Apple-Silicon hardware — their
  # toolchain needs on-Mac fixes that cannot be verified without a Mac (Homebrew's
  # `lua` is now 5.5 not 5.4; the Intel runner hit a /usr/local brew permission
  # error). Phase 7 re-introduces a `strategy.matrix` over ubuntu + the two macOS
  # runners; until then this is a single hardcoded job (no matrix).
  build:
    name: build linux-x86_64
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable release tag (T-06-03-01: never @main). Hardening to
      # a full commit SHA is a recommended follow-up once registry access exists.
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Resolve the publish channel from the trigger ref ALONE (D-07). A tag ref
      # (refs/tags/v*) => stable (the existing, unchanged path); ANY other ref
      # (schedule cron / workflow_dispatch on a branch) => nightly. There is NO
      # manual channel input to spoof (T-06.3-02-03) — github.ref is the only
      # signal. This step is decision-free trigger-plumbing: the D-01 CI exception.
      #
      # The nightly tag is datestamped UTC (D-04): nightly-YYYYMMDD. Two runs on the
      # SAME UTC date collide on the same tag — that is handled DOWNSTREAM by the
      # idempotent view-or-create-or-view + `gh release upload --clobber` reuse
      # (Claude's discretion D-05: clobber, not a -1/-2 suffix), so a same-day
      # re-run refreshes the assets in place rather than spawning a second release.
      - name: Resolve channel (D-07)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "CHANNEL=stable" >>"$GITHUB_ENV"
            echo "TAG=$GITHUB_REF_NAME" >>"$GITHUB_ENV"
            echo "[release] channel=stable tag=$GITHUB_REF_NAME"
          else
            tag="nightly-$(date -u +%Y%m%d)"
            echo "CHANNEL=nightly" >>"$GITHUB_ENV"
            echo "TAG=$tag" >>"$GITHUB_ENV"
            echo "[release] channel=nightly tag=$tag"
          fi

      - name: Install Lua toolchain (lua5.4 + luastatic)
        run: ./tools/ci-setup-toolchain.sh

      - name: Build dist/wez (same path as make build)
        run: ./tools/build.sh

      # NOTE: the Apple-Silicon ad-hoc codesign step lives only on the macOS arm64
      # leg, which is deferred to Phase 7 along with the rest of the macOS matrix.

      # Name + checksum the asset. The asset name is derived from
      # tools/lib/platform.sh `platform_os`/`platform_arch` — BYTE-IDENTICALLY to
      # tools/build.sh download_release() and tools/publish.sh — so the published
      # name matches exactly what the installer/`wez update` will request on each
      # host (P6-D08). NOTE: platform_os returns "macos" on Darwin, so the macOS
      # legs publish `wez-macos-<arch>` (the name the consumer asks for), NOT
      # `wez-darwin-<arch>`. The matrix `os: darwin` field only selects runners /
      # gates the codesign step above; it is intentionally NOT the asset name.
      - name: Name + checksum asset
        run: |
          . tools/lib/platform.sh
          asset="wez-$(platform_os)-$(platform_arch)"
          cp dist/wez "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
          echo "WEZ_ASSET=$asset" >>"$GITHUB_ENV"
          echo "[release] prepared $asset + $asset.sha256"

      # Upload via the IDENTICAL command tools/publish.sh runs (same-contract
      # rule, P6-D08): `gh release upload <tag> <asset> <asset>.sha256 --clobber`.
      # gh owns its own auth via github.token (no third-party action to pin).
      # `gh release upload` requires the release to already exist — it does NOT
      # create one. With three matrix legs racing, create it idempotently:
      # view-or-create-or-view. If a sibling leg wins the create between our view
      # and create, our create fails but the trailing view confirms it now exists,
      # so the step still succeeds. (contents: write already grants create.)
      - name: Ensure release exists
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1

      - name: Upload release asset
        # Only a real tag push has a release to upload to; a workflow_dispatch
        # dry-run builds + checksums the asset but skips the upload.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$WEZ_ASSET" "$WEZ_ASSET.sha256" --clobber
