# .github/workflows/release.yml
#
# INST-08 supply side: a tag-triggered 3-leg matrix that builds the `wez`
# luastatic binary natively per OS/arch and publishes each as a GitHub Release
# asset under the SAME asset-naming + per-asset .sha256 contract as `make publish`
# (tools/publish.sh) — so a CI-published asset and a maintainer-published asset
# never drift (P6-D08, same-contract rule).
#
# D-01 boundary: this workflow is PURE build+publish glue. It computes NO
# install/version/update decision in YAML — toolchain provisioning is delegated to
# tools/ci-setup-toolchain.sh and the build to tools/build.sh (the SAME path
# `make build` uses locally).
#
# Runner labels (RESEARCH Pitfall 7 / State of the Art): the Intel x86_64 leg uses
# `macos-15-intel` — the older Intel image P6-D01 originally named was REMOVED by
# GitHub on 2025-12-04, so that retired label must NEVER appear here. `macos-14` is
# the arm64-only Apple Silicon image (free arm64 hardware — the in-build smoke runs
# there).
#
# NOTE: this workflow is NOT exercised via a LIVE CI run until Plan 07-04 dispatches
# it (workflow_dispatch dry-run, `gh run watch`). HERE in 07-03 it is verified for
# CORRECTNESS — actionlint (the static-lint owner; 07-04 does NOT re-run it) + greps
# + the tests/cli/ci_macos_toolchain_test.lua TEXT gate.
name: release

on:
  push:
    tags:
      - "v*"
  # Manual trigger: lets a maintainer dry-run / force a nightly publish from the
  # Actions UI without cutting a version tag. Per D-07 a dispatch ref is a NON-tag
  # ref, so a workflow_dispatch run resolves CHANNEL=nightly and publishes a
  # datestamped nightly-YYYYMMDD prerelease (same path the schedule cron takes).
  #
  # DRY-RUN proof path (the UNATTENDED macOS-leg evidence): a workflow_dispatch run
  # builds + ad-hoc-codesigns + uploads ALL THREE legs (incl. both macOS arches) to
  # a nightly-YYYYMMDD PRERELEASE — excluded from /releases/latest — WITHOUT cutting
  # a real `v*` tag. There is NO manual channel input field to spoof (T-07-11):
  # github.ref alone decides the channel. Plan 07-04 Task 1 dispatches this and
  # watches it (`gh run watch`) as the live proof; 07-03 only verifies correctness
  # (actionlint + the TEXT gate), per the header NOTE.
  workflow_dispatch:
  # D-05: weekly cadence — a self-renewing nightly channel that tracks `main`.
  # The `nightly` keyword is kept by convention (it is the prerelease channel name
  # the installer/`wez update` ask for, D-03), even though the cron fires weekly,
  # not nightly. 06:17 UTC every Monday (off-peak; avoids the top-of-hour rush).
  schedule:
    - cron: "17 6 * * 1"

# Least privilege (T-06-03-03): only the scope `gh release upload` needs.
permissions:
  contents: write

jobs:
  # 3-LEG MATRIX (Phase 7, macOS Parity Pass, D-18): each leg builds the `wez`
  # luastatic binary NATIVELY on its own OS/arch runner and publishes the asset
  # under the same name + .sha256 contract. The macOS legs' on-Mac toolchain fixes
  # landed in 07-03 Task 1 (ci-setup-toolchain.sh pins keg-only lua@5.4; build.sh
  # ad-hoc codesigns both arches). NEVER add the retired Intel image GitHub removed
  # on 2025-12-04 (Pitfall 7) — use `macos-15-intel`. fail-fast: false so one leg
  # failing does not cancel the others.
  build:
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest    # linux-x86_64
          - macos-15-intel   # darwin-x86_64 (Intel)
          - macos-14         # darwin-aarch64 (Apple Silicon — free arm64 hardware)
    steps:
      # Pinned to an immutable release tag (T-06-03-01: never @main). Hardening to
      # a full commit SHA is a recommended follow-up once registry access exists.
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Resolve the publish channel from the trigger ref ALONE (D-07). A tag ref
      # (refs/tags/v*) => stable (the existing, unchanged path); ANY other ref
      # (schedule cron / workflow_dispatch on a branch) => nightly. There is NO
      # manual channel input to spoof (T-06.3-02-03) — github.ref is the only
      # signal. This step is decision-free trigger-plumbing: the D-01 CI exception.
      #
      # The nightly tag is datestamped UTC (D-04): nightly-YYYYMMDD. Two runs on the
      # SAME UTC date collide on the same tag — that is handled DOWNSTREAM by the
      # idempotent view-or-create-or-view + `gh release upload --clobber` reuse
      # (Claude's discretion D-05: clobber, not a -1/-2 suffix), so a same-day
      # re-run refreshes the assets in place rather than spawning a second release.
      - name: Resolve channel (D-07)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "CHANNEL=stable" >>"$GITHUB_ENV"
            echo "TAG=$GITHUB_REF_NAME" >>"$GITHUB_ENV"
            echo "[release] channel=stable tag=$GITHUB_REF_NAME"
          else
            tag="nightly-$(date -u +%Y%m%d)"
            echo "CHANNEL=nightly" >>"$GITHUB_ENV"
            echo "TAG=$tag" >>"$GITHUB_ENV"
            echo "[release] channel=nightly tag=$tag"
          fi

      # Skip-if-unchanged guard (D-05). On the NIGHTLY channel ONLY: a scheduled
      # run whose HEAD SHA equals the SHA the newest existing nightly-* release was
      # built from is a no-op — no empty rebuild/publish/prune. We record the
      # built-from SHA in the nightly release NOTES (Claude's discretion D-05: a
      # `built-from: <sha>` marker line, read back with `gh release view --json
      # body`), rather than in a tag annotation. We expose the decision as the
      # `unchanged` step OUTPUT consumed by the publish/prune `if:` guards below —
      # we do NOT `exit 0` the whole job, because the stable path (its own tag
      # trigger) must always run regardless of nightly state.
      - name: Skip if unchanged (nightly only)
        id: nightly_guard
        if: env.CHANNEL == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          # Newest nightly-* release tag (YYYYMMDD sorts lexically == chronologically).
          last_nightly="$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("nightly-")) | .tagName] | sort | reverse | .[0] // empty')"
          unchanged=false
          if [[ -n "$last_nightly" ]]; then
            recorded="$(gh release view "$last_nightly" --json body \
              --jq '.body' 2>/dev/null \
              | sed -n 's/^built-from:[[:space:]]*\([0-9a-f]\{7,40\}\).*/\1/p' \
              | head -n1)"
            if [[ -n "$recorded" && "$recorded" == "$head_sha" ]]; then
              unchanged=true
            fi
          fi
          echo "unchanged=$unchanged" >>"$GITHUB_OUTPUT"
          echo "[release] nightly guard: head=$head_sha last=$last_nightly unchanged=$unchanged"

      - name: Install Lua toolchain (lua5.4 + luastatic)
        run: ./tools/ci-setup-toolchain.sh

      # D-11 branch-aware version stamp: pass the resolved channel tag as the
      # version base + the dispatched branch name so build.sh stamps
      # `<tag>+<branchname>` into the embedded `wez version` on a non-main branch
      # (the autonomous E2E loop then proves it installed THIS branch's artifact).
      # The GitHub release TAG stays bare (nightly-YYYYMMDD); only the embedded
      # version carries the `+branch` suffix. build.sh maps `/`->`-` for SemVer
      # build-metadata safety and only appends the suffix when the branch != main.
      - name: Build dist/wez (same path as make build)
        env:
          WEZ_BUILD_VERSION: ${{ env.TAG }}
          WEZ_BUILD_BRANCH: ${{ github.ref_name }}
        run: ./tools/build.sh

      # NOTE: build-time ad-hoc codesign now happens INSIDE tools/build.sh
      # (build_with_luastatic, guarded by platform_os=macos) on BOTH macOS legs —
      # no separate codesign step is needed here. The arm64-only smoke below proves
      # the signed arm64 Mach-O actually runs on real Apple Silicon.

      # arm64-only in-build smoke (RESEARCH Open Q3): the macos-14 runner IS Apple
      # Silicon, so this is FREE arm64 evidence with no local Mac. Re-verify the
      # ad-hoc signature build.sh applied, then run the binary — `version` must
      # produce real output (the runner SIGKILLs an unsigned arm64 Mach-O, so a
      # successful run is also signature evidence). Gated to the macos-14 leg only.
      - name: arm64 smoke (codesign --verify + run) [macos-14 only]
        if: matrix.runner == 'macos-14'
        run: |
          codesign --verify --verbose dist/wez
          ./dist/wez version

      # Name + checksum the asset. The asset name is derived from
      # tools/lib/platform.sh `platform_os`/`platform_arch` — BYTE-IDENTICALLY to
      # tools/build.sh download_release() and tools/publish.sh — so the published
      # name matches exactly what the installer/`wez update` will request on each
      # host (P6-D08). NOTE: platform_os returns "macos" on Darwin, so the macOS
      # legs publish `wez-macos-<arch>` (the name the consumer asks for), NOT
      # `wez-darwin-<arch>`. The matrix `os: darwin` field only selects runners /
      # gates the codesign step above; it is intentionally NOT the asset name.
      - name: Name + checksum asset
        run: |
          . tools/lib/platform.sh
          asset="wez-$(platform_os)-$(platform_arch)"
          cp dist/wez "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
          echo "WEZ_ASSET=$asset" >>"$GITHUB_ENV"
          echo "[release] prepared $asset + $asset.sha256"

      # Upload via the IDENTICAL command tools/publish.sh runs (same-contract
      # rule, P6-D08): `gh release upload <tag> <asset> <asset>.sha256 --clobber`.
      # gh owns its own auth via github.token (no third-party action to pin).
      # `gh release upload` requires the release to already exist — it does NOT
      # create one. With three matrix legs racing, create it idempotently:
      # view-or-create-or-view. If a sibling leg wins the create between our view
      # and create, our create fails but the trailing view confirms it now exists,
      # so the step still succeeds. (contents: write already grants create.)
      # Channel-aware (D-04/D-07). Runs for BOTH channels using the resolved $TAG
      # (nightly-YYYYMMDD or $GITHUB_REF_NAME) — but skips when the nightly guard
      # reported the HEAD unchanged (D-05). The nightly channel passes --prerelease
      # (D-03/D-04) so the release is excluded from /releases/latest (Plan 03's
      # `stable` resolver), and embeds the built-from SHA in the notes as a
      # `built-from: <sha>` marker that the skip-if-unchanged guard reads back.
      # The stable channel keeps the existing non-prerelease, --generate-notes shape.
      - name: Ensure release exists
        if: ${{ !(env.CHANNEL == 'nightly' && steps.nightly_guard.outputs.unchanged == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CHANNEL" == "nightly" ]]; then
            notes="$(printf 'Automated nightly build.\n\nbuilt-from: %s\n' "$(git rev-parse HEAD)")"
            if gh release view "$TAG" >/dev/null 2>&1; then
              # Same-UTC-date re-run with a NEW commit: the dated release already
              # exists, so refresh the built-from marker in place (clobber, D-05).
              gh release edit "$TAG" --prerelease --notes "$notes"
            else
              gh release create "$TAG" \
                --title "$TAG" --prerelease --notes "$notes" \
              || gh release edit "$TAG" --prerelease --notes "$notes"
            fi
          else
            gh release view "$TAG" >/dev/null 2>&1 \
              || gh release create "$TAG" \
                   --title "$TAG" --generate-notes \
              || gh release view "$TAG" >/dev/null 2>&1
          fi

      # Upload via the IDENTICAL command tools/publish.sh runs (same-contract rule,
      # P6-D08) — byte-identical except $GITHUB_REF_NAME -> the resolved $TAG so it
      # serves nightly-YYYYMMDD too. Skips on a nightly unchanged no-op (D-05).
      - name: Upload release asset
        if: ${{ !(env.CHANNEL == 'nightly' && steps.nightly_guard.outputs.unchanged == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "$WEZ_ASSET" "$WEZ_ASSET.sha256" --clobber

      # Prune old nightlies (D-06). Retention = newest 5 nightly-* releases; delete
      # the rest. Runs ONLY on the nightly channel and ONLY after a successful,
      # non-skipped publish (never on the stable path, never on an unchanged no-op).
      # This is new logic kept as decision-free trigger-plumbing (the D-01 CI
      # exception). It is HARD-SCOPED to nightly-* ONLY: the list is filtered to the
      # `nightly-` prefix, and a `case "$tag" in nightly-*)` guard re-asserts the
      # prefix immediately before every `gh release delete`, so a stable v* release
      # can NEVER be reached by the delete (T-06.3-02-02). Distinct factored step
      # so a Phase 7 matrix can wrap build/publish without touching prune (D-12).
      # SINGLE-LEG GUARD: with three matrix legs running, the prune MUST run on
      # exactly ONE leg (ubuntu-latest) — otherwise all three legs would race the
      # same `gh release delete` calls. The nightly + unchanged guards still apply.
      - name: Prune old nightly releases (D-06)
        if: ${{ matrix.runner == 'ubuntu-latest' && env.CHANNEL == 'nightly' && steps.nightly_guard.outputs.unchanged != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # nightly-* tags ONLY (NEVER v*), newest-first; YYYYMMDD sorts lexically.
          mapfile -t nightly_tags < <(
            gh release list --limit 100 --json tagName \
              --jq '[.[] | select(.tagName | startswith("nightly-")) | .tagName] | sort | reverse | .[]'
          )
          echo "[release] found ${#nightly_tags[@]} nightly-* releases; keeping newest 5"
          # Slice off the newest 5; everything from index 5 on is pruned.
          for tag in "${nightly_tags[@]:5}"; do
            # Hard guard: only a nightly--prefixed tag can ever be deleted.
            case "$tag" in
              nightly-*)
                echo "[release] pruning $tag"
                gh release delete "$tag" --yes --cleanup-tag
                ;;
              *)
                echo "[release] refusing to delete non-nightly tag: $tag" >&2
                continue
                ;;
            esac
          done
